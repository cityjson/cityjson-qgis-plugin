name: Ruff Lint and Format

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  ruff-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check .

  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Ruff
        run: pip install ruff
      - name: Run ruff format
        run: ruff format --check .
